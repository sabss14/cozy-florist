<header><h1>🐭⚔️ MoskeRats </h1><div class="sub">Gremio · tablero y colecciones</div></header>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =========================================================
   PEGA AQUÍ TUS DOS DATOS DE SUPABASE.
   NO pongas aquí la secret/service_role key.
   ========================================================= */
const SUPABASE_URL = "https://dykvyixivccgzwzvghyx.supabase.co";
const SUPABASE_KEY = "sb_publishable_IvegPNXIuaQhi43TbS8AWQ_PwH5SD9G";

const configured = !SUPABASE_URL.startsWith("PEGA_AQUI") && !SUPABASE_KEY.startsWith("PEGA_AQUI");
const supabase = configured ? createClient(SUPABASE_URL,SUPABASE_KEY) : null;
let page="home", state={players:[],flowers:[],owns:[],missions:[],weeks:[],weeklyStats:[]}, session=null;

const $=s=>document.querySelector(s);
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(ms){if(ms<=0)return "Lista para nueva misión";let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),ss=s%60;return `${h?String(h).padStart(2,"0")+":":""}${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}
function flower(id){return state.flowers.find(x=>x.id===id)}
function flowerVisual(f){return f?.image_url?`<img class="flower-img" src="${esc(f.image_url)}" alt="${esc(f.name)}" loading="lazy">`:`<div class="flower-placeholder">Sin foto</div>`}
function player(id){return state.players.find(x=>x.id===id)}
function has(pid,fid){return state.owns.some(x=>x.player_id===pid&&x.flower_id===fid)}
function eligible(fid){return state.players.filter(p=>p.active&&has(p.id,fid))}
function setPage(p){page=p;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.page));

async function load(){
 if(!configured){render();return}
 const [p,f,o,m,w,ws]=await Promise.all([
   supabase.from("players").select("*").order("id"),
   supabase.from("flowers").select("*").order("id"),
   supabase.from("player_flowers").select("*"),
   supabase.from("missions").select("*").order("slot_number"),
   supabase.from("competition_weeks").select("*").order("start_date",{ascending:false}),

function calcWeekly(rows){
 const clean=rows.map(r=>({missions:Number(r.missions_done)||0,points:Number(r.points_done)||0,max:Number(r.max_points)||0}));
 const totalM=clean.reduce((a,r)=>a+r.missions,0), totalP=clean.reduce((a,r)=>a+r.points,0), totalMax=clean.reduce((a,r)=>a+r.max,0);
 const avgM=totalM?totalP/totalM:0, obligatory=clean.filter(r=>r.missions>=18).length, maximum=clean.filter(r=>r.missions>=24).length;
 return {totalM,totalP,totalMax,avgM,obligatory,maximum};
}

 const name=prompt('Nombre de la nueva semana/competencia:','Semana '+(state.weeks.length+1)); if(!name)return;
 const start=prompt('Fecha de inicio (AAAA-MM-DD):',new Date().toISOString().slice(0,10)); if(!start)return;
 const end=prompt('Fecha de fin (AAAA-MM-DD):',start); if(!end)return;
 await supabase.from('competition_weeks').update({is_current:false}).eq('is_current',true);
 const {data,error}=await supabase.from('competition_weeks').insert({name:name.trim(),start_date:start,end_date:end,is_current:true}).select().single();
 if(error)return alert('No se pudo crear la semana: '+error.message);
 const previous=state.weeks[0]; const prevStats=previous?weekStats(previous.id):[];
 const rows=state.players.filter(p=>p.active).map(p=>{const old=prevStats.find(r=>Number(r.player_id)===Number(p.id));return {week_id:data.id,player_id:p.id,missions_done:0,points_done:0,max_points:Number(old?.max_points)||0}});
 if(rows.length){const {error:e}=await supabase.from('weekly_player_stats').insert(rows);if(e)return alert('La semana se creó, pero no se pudieron preparar las jugadoras: '+e.message)}
 await load(); page='weeklyStats';render();
};
window.saveWeeklyStats=async(weekId)=>{
 const rows=state.players.filter(p=>p.active).map(p=>{const vals={};document.querySelectorAll(`[data-player="${p.id}"]`).forEach(el=>vals[el.dataset.field]=Number(el.value)||0);return {week_id:weekId,player_id:p.id,missions_done:Math.min(24,Math.max(0,vals.missions_done||0)),points_done:Math.max(0,vals.points_done||0),max_points:Math.max(0,vals.max_points||0)}});
 const {error}=await supabase.from('weekly_player_stats').upsert(rows,{onConflict:'week_id,player_id'}); if(error)return alert('No se pudieron guardar las estadísticas: '+error.message); await load(); page='weeklyStats';render(); alert('Estadísticas guardadas.');
};
window.editMissions=()=>{
  page="missionEditor";
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  render();
};

function missionEditor(){
  const missions=[...state.missions].sort((a,b)=>a.slot_number-b.slot_number);
  $("#app").innerHTML=`<section class="mission-editor-board">
    <div class="mission-editor-head">
      <div><h2 style="margin:0">🎯 Tablero de misiones</h2><p>Haz clic en una misión para elegir su flor. El estado se cambia con una casilla.</p></div>
      <button class="small" onclick="window.backToAdmin()">← Volver a Administración</button>
    </div>
    <div id="missionBoardGrid" class="mission-board-grid">${missions.map(missionEditCard).join("")}</div>
    <div class="mission-save-bar"><span id="missionSaveInfo">Los cambios se guardan al pulsar “Guardar misiones”.</span><button class="primary" onclick="window.saveMissionBoard()">💾 Guardar misiones</button></div>
  </section>`;
};

function missionEditCard(m){
  const f=flower(m.flower_id);
  const isInProgress=m.status==="in_progress";
  return `<div class="mission-edit-card" id="missionEditCard-${m.slot_number}" onclick="window.toggleMissionPicker(${m.slot_number})">
    <div class="mission-edit-slot"><b>#${m.slot_number}</b>${f?`<span style="font-size:10px">🌸</span>`:`<span style="font-size:10px">—</span>`}</div>
    <div class="mission-edit-flower">
      ${f?.image_url?`<img src="${esc(f.image_url)}" alt="" loading="lazy">`:f?`<div class="mission-no-flower">${esc(f.emoji||"🌸")}</div>`:`<div class="mission-no-flower">＋</div>`}
      <div class="mission-edit-name">${esc(f?.name||"Elegir flor")}</div>
    </div>
    <div class="mission-state-options" onclick="event.stopPropagation()">
      <label class="mission-state-option available"><input type="radio" name="mission-state-${m.slot_number}" value="active" ${!isInProgress?"checked":""} onchange="window.markMissionDirty(${m.slot_number})"> Disponible</label>
      <label class="mission-state-option inprogress"><input type="radio" name="mission-state-${m.slot_number}" value="in_progress" ${isInProgress?"checked":""} onchange="window.markMissionDirty(${m.slot_number})"> En curso</label>
    </div>
    <div class="mission-flower-picker" onclick="event.stopPropagation()">
      <input class="mission-flower-search" placeholder="🔎 Buscar flor..." oninput="window.filterMissionFlowers(${m.slot_number},this.value)" onclick="event.stopPropagation()">
      <div class="mission-flower-options" id="missionFlowerOptions-${m.slot_number}">
        ${missionFlowerOptions(m)}
      </div>
    </div>
  </div>`;
}

function missionFlowerOptions(m,query=""){
  const q=String(query||"").trim().toLowerCase();
  return [...state.flowers].sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"es",{sensitivity:"base",numeric:true}))
    .filter(f=>!q||String(f.name||"").toLowerCase().includes(q))
    .map(f=>`<button type="button" class="mission-flower-option ${Number(m.flower_id)===Number(f.id)?"selected":""}" data-slot="${m.slot_number}" data-flower-id="${f.id}" onclick="window.chooseMissionFlower(event,${m.slot_number},${f.id})">
      ${f.image_url?`<img src="${esc(f.image_url)}" alt="" loading="lazy">`:`<span class="mission-flower-emoji">${esc(f.emoji||"🌸")}</span>`}
      <span>${esc(f.name)}</span>
    </button>`).join("");
}

window.toggleMissionPicker=(slot)=>{
  const card=$(`#missionEditCard-${slot}`);
  if(!card)return;
  document.querySelectorAll(".mission-edit-card.selected").forEach(x=>{if(x!==card)x.classList.remove("selected")});
  card.classList.toggle("selected");
  if(card.classList.contains("selected")){
    const input=card.querySelector(".mission-flower-search");
    if(input){input.value="";setTimeout(()=>input.focus(),0)}
  }
};

window.filterMissionFlowers=(slot,query)=>{
  const m=state.missions.find(x=>x.slot_number===slot);
  const box=$(`#missionFlowerOptions-${slot}`);
  if(box&&m)box.innerHTML=missionFlowerOptions(m,query);
};

window.chooseMissionFlower=(event,slot,fid)=>{
  event.preventDefault();event.stopPropagation();
  const m=state.missions.find(x=>x.slot_number===slot);
  if(!m)return;
  m.flower_id=Number(fid);
  m.__dirty=true;
  const card=$(`#missionEditCard-${slot}`);
  if(card){
    const f=flower(fid);
    const visual=card.querySelector(".mission-edit-flower");
    if(visual)visual.innerHTML=`${f?.image_url?`<img src="${esc(f.image_url)}" alt="" loading="lazy">`:`<div class="mission-no-flower">${esc(f?.emoji||"🌸")}</div>`}<div class="mission-edit-name">${esc(f?.name||"Elegir flor")}</div>`;
    card.querySelectorAll(".mission-flower-option").forEach(x=>x.classList.toggle("selected",Number(x.dataset.flowerId)===Number(fid)));
  }
  markMissionDirty(slot);
};

window.markMissionDirty=(slot)=>{
  const m=state.missions.find(x=>x.slot_number===slot);
  if(m)m.__dirty=true;
  const info=$("#missionSaveInfo");
  if(info)info.textContent="Hay cambios sin guardar.";
};

window.saveMissionBoard=async()=>{
  const dirty=state.missions.filter(m=>m.__dirty);
  if(!dirty.length){alert("No hay cambios para guardar.");return}
  const info=$("#missionSaveInfo");
  if(info)info.textContent="Guardando…";
  for(const m of dirty){
    const radio=document.querySelector(`input[name="mission-state-${m.slot_number}"]:checked`);
    const status=radio?.value==="in_progress"?"in_progress":"active";
    const patch={
      flower_id:m.flower_id?Number(m.flower_id):null,
      status,
      points:0,
      waiting_started_at:null,
      replacement_at:null,
      completed_by:null,
      completed_at:null
    };
    const {error}=await supabase.from("missions").update(patch).eq("slot_number",m.slot_number);
    if(error){alert(`No se pudo guardar la misión #${m.slot_number}: ${error.message}`);if(info)info.textContent="Revisa los cambios y vuelve a intentarlo.";return}
  }
  await load();
  page="missionEditor";
  render();
  const newInfo=$("#missionSaveInfo");
  if(newInfo)newInfo.textContent="✓ Todas las misiones guardadas.";
};

window.backToAdmin=()=>setPage("admin");

function openDlg(x){$("#dlgbody").innerHTML=x;$("#dlg").showModal()}function closeDlg(){$("#dlg").close()}window.closeDlg=closeDlg;
window.go=setPage;
supabase?.auth.getSession().then(({data})=>{session=data.session;load()});
if(supabase){supabase.channel("cozy-live").on("postgres_changes",{event:"*",schema:"public",table:"players"},load).on("postgres_changes",{event:"*",schema:"public",table:"flowers"},load).on("postgres_changes",{event:"*",schema:"public",table:"player_flowers"},load).on("postgres_changes",{event:"*",schema:"public",table:"missions"},load).subscribe()}
setInterval(()=>{if(page==="missions")drawMissions(state.missions)},1000);
</script>
